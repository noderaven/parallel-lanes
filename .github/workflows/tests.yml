name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        if: matrix.os == 'windows-latest'
        with:
          python-version: '3.12'
      - name: Tool versions
        shell: bash
        run: |
          bash --version | head -n 1
          git --version
          python3 --version
          jq --version
          node --version
      - name: Git identity for the tests' temporary repos
        shell: bash
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run the test suite
        run: node --test tests/
