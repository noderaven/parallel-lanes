name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}${{ matrix.python && format(' / Python {0}', matrix.python) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Without python, a job uses the runner's own python3 (macOS's moves
        # with the runner image). The 3.15 job tests the newest Python on
        # purpose rather than waiting for an image to move.
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 24
            python: '3.15'
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        if: matrix.python
        with:
          python-version: ${{ matrix.python }}
      - name: Tool versions
        shell: bash
        run: |
          bash --version | head -n 1
          git --version
          python3 --version
          jq --version
          node --version
      - name: Git identity for the tests' temporary repos
        shell: bash
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run the test suite
        run: node tests/run-tests.mjs
      # A test that writes into the checkout (a __pycache__, a stray file)
      # can make the next run on the same checkout fail; CI runs only once.
      - name: The test suite leaves the checkout unchanged
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "the test suite changed the checkout:"
            echo "$status"
            exit 1
          fi
